# NOT generated by scitrera-repo-tools — this one is hand-maintained.
# The generator owns test-*.yml / publish-*.yml / version-check.yml (each
# carries a "Generated by" header); this file is outside that set.
#
# Each architecture is built on a NATIVE runner and pushed by digest, then a
# final job stitches the digests into one multi-arch manifest. Deliberately
# not QEMU: this image compiles NCCL and nccl-tests with nvcc across four GPU
# architectures, and emulated cross-compilation of that turns a ~20 minute
# build into hours (and routinely trips emulator bugs in the toolchain). Two
# native runners in parallel also finish in the time of the slower one, rather
# than the sum.
#
# Publishing is a deliberate action, never automatic on push: the image is
# ~3 GB per architecture and its cadence is the NCCL release, not our commit
# rate. Pull requests only BUILD, to prove the Dockerfile still works.
#
# `ubuntu-24.04-arm` is a GitHub-hosted arm64 runner — free for public
# repositories. A private repo needs a larger-runner plan or a self-hosted
# arm64 runner; swap the label in the matrix below.

name: RDMA Test Image

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Publish to GHCR (otherwise build only)"
        type: boolean
        default: false
  pull_request:
    paths:
      - 'docker/rdma-test/**'
      - '.github/workflows/rdma-test-image.yml'

permissions:
  contents: read

env:
  PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}

jobs:
  build:
    strategy:
      # One architecture failing should not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The runner ships ~20GB of toolchains this build never uses, and a
      # CUDA -devel build does not fit alongside them.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      # Sourced rather than `cat`-ed into $GITHUB_ENV: NVCC_GENCODE is quoted
      # (it contains spaces, and build.sh sources the same file), and $GITHUB_ENV
      # takes values literally — a straight copy would carry the quote
      # characters through into the build-arg.
      - name: Load pinned inputs
        run: |
          set -a; . ./docker/rdma-test/image.env; set +a
          for key in IMAGE_REPO IMAGE_TAG NCCL_VERSION NCCL_TESTS_VERSION CUDA_VERSION UBUNTU_VERSION UBUNTU_TAG NVCC_GENCODE; do
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
          test -n "$NVCC_GENCODE" || { echo "NVCC_GENCODE did not survive parsing" >&2; exit 1; }

      # No setup-qemu-action: every job runs on its target architecture.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push-by-digest uploads an untagged image and returns its digest; the
      # merge job is what attaches the tags. Tags must NOT be set here, or
      # buildx rejects the combination.
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/rdma-test
          platforms: ${{ matrix.platform }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_REPO) || '' }}
          # NCCL_GIT_REF, not NCCL_VERSION: the NGC base images define
          # ENV NCCL_VERSION, which outranks a same-named ARG under the legacy
          # builder, so that name silently builds NVIDIA's bundled NCCL there.
          build-args: |
            CUDA_VERSION=${{ env.CUDA_VERSION }}
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
            UBUNTU_TAG=${{ env.UBUNTU_TAG }}
            NCCL_GIT_REF=${{ env.NCCL_VERSION }}
            NCCL_TESTS_GIT_REF=${{ env.NCCL_TESTS_VERSION }}
            NVCC_GENCODE=${{ env.NVCC_GENCODE }}
          # Scoped per architecture: a shared scope would have the two jobs
          # overwrite each other's cache every run.
          cache-from: type=gha,scope=rdma-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rdma-${{ matrix.arch }}

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ steps.build.outputs.digest }}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Only a publishing run has digests to combine.
    if: github.event_name == 'workflow_dispatch' && inputs.push
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Sourced rather than `cat`-ed into $GITHUB_ENV: NVCC_GENCODE is quoted
      # (it contains spaces, and build.sh sources the same file), and $GITHUB_ENV
      # takes values literally — a straight copy would carry the quote
      # characters through into the build-arg.
      - name: Load pinned inputs
        run: |
          set -a; . ./docker/rdma-test/image.env; set +a
          for key in IMAGE_REPO IMAGE_TAG NCCL_VERSION NCCL_TESTS_VERSION CUDA_VERSION UBUNTU_VERSION UBUNTU_TAG NVCC_GENCODE; do
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
          test -n "$NVCC_GENCODE" || { echo "NVCC_GENCODE did not survive parsing" >&2; exit 1; }

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The digest files are named `sha256:<hex>`; each becomes one source
      # reference for the manifest list.
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:${IMAGE_TAG}" \
            -t "${IMAGE_REPO}:latest" \
            $(printf "${IMAGE_REPO}@%s " *)

      - name: Verify both architectures are present
        run: |
          docker buildx imagetools inspect "${IMAGE_REPO}:${IMAGE_TAG}"
          for want in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect --raw "${IMAGE_REPO}:${IMAGE_TAG}" \
              | grep -q "\"architecture\":\"${want#linux/}\"" \
              || { echo "manifest is missing ${want}" >&2; exit 1; }
          done
